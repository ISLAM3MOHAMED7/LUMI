<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل المنتج | LUMI</title>
<link rel="icon" href="logo.jpg">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
  :root{--bg:#0a0a0a;--card:#141414;--text:#f5f5f5;--muted:#999;--accent:#c0c0c0;--danger:#e63946}
  body{background:var(--bg);color:var(--text);min-height:100vh}
  a{color:inherit;text-decoration:none}

  header{background:#000;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;position:sticky;top:0;z-index:100}
  .logo img{height:45px;width:auto;object-fit:contain;border-radius:4px}
  .icon-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid #222;font-size:20px;transition:.2s}
  .icon-btn:hover{border-color:var(--accent)}
  .cart-badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;padding:0 6px;display:none;align-items:center;justify-content:center}
  .cart-badge.show{display:inline-flex}

  .back{max-width:1100px;margin:16px auto 0;padding:0 24px;font-size:13px;color:var(--muted)}
  .back a{color:var(--accent)}
  .back a:hover{text-decoration:underline}

  .product-wrap{max-width:1100px;margin:20px auto 60px;padding:0 24px;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:flex-start}

  .gallery{position:sticky;top:90px}
  .main-img{width:100%;aspect-ratio:4/5;background:#1a1a1a;border-radius:14px;overflow:hidden;border:1px solid #222}
  .main-img img{width:100%;height:100%;object-fit:cover}
  .thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .thumb{width:70px;height:70px;border-radius:8px;overflow:hidden;border:2px solid transparent;cursor:pointer;transition:.2s;background:#1a1a1a;flex-shrink:0}
  .thumb:hover{border-color:#333}
  .thumb.active{border-color:var(--accent)}
  .thumb img{width:100%;height:100%;object-fit:cover}

  .info{padding-top:8px}
  .cat-tag{color:var(--accent);font-size:12px;letter-spacing:2px;font-weight:700;margin-bottom:8px;display:inline-block;padding:4px 10px;border:1px solid var(--accent);border-radius:20px}
  .info h1{font-size:32px;margin-bottom:16px;line-height:1.25}
  .price-block{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid #222;flex-wrap:wrap}
  .price{font-size:30px;font-weight:800;color:var(--accent)}
  .old-price{font-size:18px;color:#666;text-decoration:line-through}
  .disc-tag{background:var(--danger);color:#fff;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
  .desc{font-size:15px;color:#ccc;line-height:1.75;margin-bottom:24px;white-space:pre-line}

  .qty-row{display:flex;align-items:center;gap:14px;margin-bottom:20px}
  .qty-row label{font-weight:600;font-size:14px}
  .qty{display:inline-flex;align-items:center;border:1px solid #333;border-radius:10px;overflow:hidden;background:var(--card)}
  .qty button{background:none;border:none;color:var(--text);font-size:20px;width:40px;height:44px;cursor:pointer;transition:.2s}
  .qty button:hover{background:#222}
  .qty span{min-width:44px;text-align:center;font-weight:700;font-size:16px}

  .actions{display:flex;flex-direction:column;gap:10px}
  .btn-primary,.btn-secondary{width:100%;padding:15px;border:none;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;transition:.2s;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-primary{background:var(--accent);color:#000}
  .btn-primary:hover{background:#e0e0e0}
  .btn-secondary{background:var(--card);color:var(--text);border:1px solid #333}
  .btn-secondary:hover{background:#1e1e1e;border-color:var(--accent)}
  .btn-secondary.wa{color:#25D366}

  .loading,.empty{text-align:center;padding:80px 20px;color:var(--muted);grid-column:1/-1}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#000;padding:12px 22px;border-radius:30px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:999}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-8px)}

  @media(max-width:800px){
    .product-wrap{grid-template-columns:1fr;gap:20px}
    .gallery{position:static}
    .info h1{font-size:24px}
    .price{font-size:24px}
    .logo img{height:35px}
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html"><img src="logo.jpg" alt="LUMI"></a>
  <a class="icon-btn" href="cart.html" title="السلة">🛒<span class="cart-badge" id="cartBadge">0</span></a>
</header>

<div class="back"><a href="index.html">← العودة للمتجر</a></div>

<main id="app">
  <div class="loading">⏳ جاري التحميل...</div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
import { db, addToCart, refreshCartBadge, money, getImages, waLinkProduct, PLACEHOLDER_IMG } from "./common.js";
import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

refreshCartBadge();
window.addEventListener("cartUpdated", refreshCartBadge);

const params = new URLSearchParams(location.search);
const id = params.get("id");
const appEl = document.getElementById("app");
const toast = document.getElementById("toast");

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 2200);
}

if (!id) {
  appEl.innerHTML = '<div class="empty">⚠️ لم يتم تحديد منتج. <a href="index.html" style="color:var(--accent)">العودة للمتجر</a></div>';
} else {
  onSnapshot(doc(db, "products", id), snap => {
    if (!snap.exists()) {
      appEl.innerHTML = '<div class="empty">❌ المنتج غير موجود. <a href="index.html" style="color:var(--accent)">العودة للمتجر</a></div>';
      return;
    }
    renderProduct({ id: snap.id, ...snap.data() });
  }, err => {
    console.error(err);
    appEl.innerHTML = '<div class="empty">⚠️ تعذّر تحميل المنتج.</div>';
  });
}

let qty = 1;

function renderProduct(p) {
  const images = getImages(p);
  const mainSrc = images[0] || PLACEHOLDER_IMG;
  const hasDisc = p.oldPrice && +p.oldPrice > +p.price;
  const discountPct = hasDisc ? Math.round(((+p.oldPrice - +p.price) / +p.oldPrice) * 100) : 0;
  const wa = waLinkProduct(p);

  appEl.innerHTML = `
    <div class="product-wrap">
      <div class="gallery">
        <div class="main-img"><img id="mainImg" src="${mainSrc}" alt="${p.name||''}"></div>
        ${images.length > 1 ? `
          <div class="thumbs" id="thumbs">
            ${images.map((src,i) => `<div class="thumb ${i===0?'active':''}" data-src="${src}"><img src="${src}" alt=""></div>`).join("")}
          </div>` : ""}
      </div>

      <div class="info">
        ${p.category ? `<span class="cat-tag">${p.category}</span>` : ""}
        <h1>${p.name || "بدون اسم"}</h1>

        <div class="price-block">
          <span class="price">${money(p.price)}</span>
          ${hasDisc ? `<span class="old-price">${money(p.oldPrice)}</span><span class="disc-tag">وفّر ${discountPct}%</span>` : ""}
        </div>

        ${p.desc ? `<p class="desc">${p.desc}</p>` : ""}

        <div class="qty-row">
          <label>الكمية:</label>
          <div class="qty">
            <button id="minus">−</button>
            <span id="qtyVal">1</span>
            <button id="plus">+</button>
          </div>
        </div>

        <div class="actions">
          <button class="btn-primary" id="addBtn">🛒 أضف إلى السلة</button>
          <a class="btn-secondary wa" href="${wa}" target="_blank">💬 اطلب هذه القطعة واتساب</a>
        </div>
      </div>
    </div>`;

  qty = 1;
  document.getElementById("plus").onclick  = () => { qty++; document.getElementById("qtyVal").textContent = qty; };
  document.getElementById("minus").onclick = () => { if (qty > 1) { qty--; document.getElementById("qtyVal").textContent = qty; } };
  document.getElementById("addBtn").onclick = () => { addToCart(p, qty); showToast(`✅ أضفت ${qty} قطعة للسلة`); };

  const thumbs = document.getElementById("thumbs");
  if (thumbs) {
    thumbs.querySelectorAll(".thumb").forEach(t => {
      t.onclick = () => {
        document.getElementById("mainImg").src = t.dataset.src;
        thumbs.querySelectorAll(".thumb").forEach(x => x.classList.remove("active"));
        t.classList.add("active");
      };
    });
  }
}
</script>
</body>
</html>
